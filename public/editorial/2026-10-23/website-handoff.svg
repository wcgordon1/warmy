<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>A useful website handoff</title><rect width="1200" height="675" fill="#f4f4f2"/><g font-family="Arial,sans-serif" fill="#1a1a1a"><text x="70" y="108" font-size="42" font-weight="700">A useful website handoff</text><rect x="70" y="190" width="510" height="160" rx="14" fill="#ffffff" stroke="#d7d7d2"/><text x="98" y="248" font-size="30" font-weight="600">1. Ownership</text><text x="98" y="302" font-size="25" fill="#555555">Accounts and renewals</text><rect x="620" y="190" width="510" height="160" rx="14" fill="#ffffff" stroke="#d7d7d2"/><text x="648" y="248" font-size="30" font-weight="600">2. Instructions</text><text x="648" y="302" font-size="25" fill="#555555">Task videos and images</text><rect x="70" y="390" width="510" height="160" rx="14" fill="#ffffff" stroke="#d7d7d2"/><text x="98" y="448" font-size="30" font-weight="600">3. Verification</text><text x="98" y="502" font-size="25" fill="#555555">Behavior and access</text><rect x="620" y="390" width="510" height="160" rx="14" fill="#ffffff" stroke="#d7d7d2"/><text x="648" y="448" font-size="30" font-weight="600">4. Support</text><text x="648" y="502" font-size="25" fill="#555555">Named responsibility</text><text x="70" y="628" font-size="22" fill="#555555">Warm Websites · Editorial checklist</text></g></svg>